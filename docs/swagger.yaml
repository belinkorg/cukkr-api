  /users/verify-otp:
    post:
      consumes:
      - application/json
      description: Verify email OTP and activate user account
      parameters:
      - description: User OTP verification data
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/internal_features_user.VerifyOTPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/cukkr-app_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_features_user.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
      summary: User Verify Email OTP
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
