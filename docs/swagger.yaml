      consumes:
      - application/json
      description: Get profile of authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/cukkr-app_pkg_response.Response'
            - properties:
                data:
