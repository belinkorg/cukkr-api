        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
      security:
      - BearerAuth: []
      summary: Get user profile
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update profile of authenticated user
      parameters:
      - description: Profile data
        in: body
        name: profile
        required: true
        schema:
          $ref: '#/definitions/internal_features_user.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/cukkr-app_pkg_response.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_features_user.UserResponse'
