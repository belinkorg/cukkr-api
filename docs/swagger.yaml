        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/cukkr-app_pkg_response.Response'
        "500":
